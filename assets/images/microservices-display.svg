<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>

  <!-- 顶部导航栏 -->
  <rect width="1200" height="60" fill="url(#headerGradient)"/>
  <text x="30" y="38" font-size="24" font-weight="bold" fill="white">MicroServices Dashboard</text>

  <!-- 左侧菜单 -->
  <rect x="0" y="60" width="250" height="740" fill="#1a1a2e" stroke="#667eea" stroke-width="1"/>
  <text x="20" y="100" font-size="16" font-weight="bold" fill="#667eea">MENU</text>
  
  <g opacity="0.7">
    <text x="30" y="140" font-size="14" fill="white">📊 Dashboard</text>
    <text x="30" y="170" font-size="14" fill="#aaa">🔧 Services</text>
    <text x="30" y="200" font-size="14" fill="#aaa">🌐 API Gateway</text>
    <text x="30" y="230" font-size="14" fill="#aaa">⚙️ Config</text>
    <text x="30" y="260" font-size="14" fill="#aaa">📈 Monitor</text>
    <text x="30" y="290" font-size="14" fill="#aaa">🔍 Trace</text>
  </g>

  <!-- 主内容区域 -->
  <g id="content">
    <!-- 标题 -->
    <text x="280" y="110" font-size="28" font-weight="bold" fill="#667eea">微服务架构系统 Dashboard</text>
    <text x="280" y="140" font-size="14" fill="#aaa">Spring Cloud + Service Mesh</text>

    <!-- 统计卡片 1 -->
    <rect x="280" y="160" width="220" height="140" fill="#2a2a3e" stroke="#667eea" stroke-width="2" rx="10"/>
    <text x="300" y="190" font-size="14" fill="#667eea" font-weight="bold">活跃服务</text>
    <text x="300" y="240" font-size="32" font-weight="bold" fill="white">52</text>
    <text x="300" y="265" font-size="12" fill="#aaa">↑ 5 个新增</text>

    <!-- 统计卡片 2 -->
    <rect x="520" y="160" width="220" height="140" fill="#2a2a3e" stroke="#764ba2" stroke-width="2" rx="10"/>
    <text x="540" y="190" font-size="14" fill="#764ba2" font-weight="bold">请求延迟</text>
    <text x="540" y="240" font-size="32" font-weight="bold" fill="white">45ms</text>
    <text x="540" y="265" font-size="12" fill="#aaa">↓ 12% 优化</text>

    <!-- 统计卡片 3 -->
    <rect x="760" y="160" width="220" height="140" fill="#2a2a3e" stroke="#667eea" stroke-width="2" rx="10"/>
    <text x="780" y="190" font-size="14" fill="#667eea" font-weight="bold">系统可用性</text>
    <text x="780" y="240" font-size="32" font-weight="bold" fill="white">99.9%</text>
    <text x="780" y="265" font-size="12" fill="#aaa">✓ 正常运行</text>

    <!-- 微服务拓扑架构 -->
    <text x="280" y="340" font-size="16" font-weight="bold" fill="#667eea">服务拓扑架构</text>

    <!-- API Gateway 中心 -->
    <rect x="520" y="380" width="160" height="60" fill="#667eea" rx="5"/>
    <text x="600" y="415" font-size="14" font-weight="bold" fill="white" text-anchor="middle">API Gateway</text>

    <!-- 上层服务 -->
    <rect x="280" y="480" width="140" height="50" fill="#764ba2" rx="5"/>
    <text x="350" y="510" font-size="12" font-weight="bold" fill="white" text-anchor="middle">User Service</text>

    <rect x="450" y="480" width="140" height="50" fill="#764ba2" rx="5"/>
    <text x="520" y="510" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Order Service</text>

    <rect x="620" y="480" width="140" height="50" fill="#764ba2" rx="5"/>
    <text x="690" y="510" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Product Service</text>

    <rect x="790" y="480" width="140" height="50" fill="#764ba2" rx="5"/>
    <text x="860" y="510" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Payment Service</text>

    <!-- 连接线 -->
    <line x1="600" y1="440" x2="350" y2="480" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="600" y1="440" x2="520" y2="480" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="600" y1="440" x2="690" y2="480" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="600" y1="440" x2="860" y2="480" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- 下层服务 -->
    <rect x="280" y="600" width="130" height="45" fill="#5a67d8" rx="5"/>
    <text x="345" y="628" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Config Server</text>

    <rect x="430" y="600" width="130" height="45" fill="#5a67d8" rx="5"/>
    <text x="495" y="628" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Service Registry</text>

    <rect x="580" y="600" width="130" height="45" fill="#5a67d8" rx="5"/>
    <text x="645" y="628" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Load Balancer</text>

    <rect x="730" y="600" width="130" height="45" fill="#5a67d8" rx="5"/>
    <text x="795" y="628" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Message Queue</text>

    <!-- 底部连接线 -->
    <line x1="350" y1="530" x2="345" y2="600" stroke="#667eea" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <line x1="520" y1="530" x2="495" y2="600" stroke="#667eea" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <line x1="690" y1="530" x2="645" y2="600" stroke="#667eea" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <line x1="860" y1="530" x2="795" y2="600" stroke="#667eea" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- 性能指标 -->
    <text x="1000" y="340" font-size="16" font-weight="bold" fill="#667eea">实时监控</text>
    
    <rect x="1000" y="360" width="180" height="60" fill="#2a2a3e" stroke="#667eea" stroke-width="1" rx="5"/>
    <text x="1010" y="378" font-size="12" fill="#aaa">CPU 使用率</text>
    <rect x="1010" y="385" width="160" height="8" fill="#444" rx="4"/>
    <rect x="1010" y="385" width="112" height="8" fill="#667eea" rx="4"/>
    <text x="1175" y="395" font-size="11" fill="white">70%</text>

    <rect x="1000" y="430" width="180" height="60" fill="#2a2a3e" stroke="#764ba2" stroke-width="1" rx="5"/>
    <text x="1010" y="448" font-size="12" fill="#aaa">内存使用率</text>
    <rect x="1010" y="455" width="160" height="8" fill="#444" rx="4"/>
    <rect x="1010" y="455" width="88" height="8" fill="#764ba2" rx="4"/>
    <text x="1175" y="465" font-size="11" fill="white">55%</text>

    <rect x="1000" y="500" width="180" height="60" fill="#2a2a3e" stroke="#667eea" stroke-width="1" rx="5"/>
    <text x="1010" y="518" font-size="12" fill="#aaa">网络吞吐量</text>
    <rect x="1010" y="525" width="160" height="8" fill="#444" rx="4"/>
    <rect x="1010" y="525" width="128" height="8" fill="#667eea" rx="4"/>
    <text x="1175" y="535" font-size="11" fill="white">80%</text>
  </g>

  <!-- 底部状态栏 -->
  <rect x="0" y="750" width="1200" height="50" fill="#1a1a2e" stroke="#667eea" stroke-width="1" stroke-top="1"/>
  <text x="30" y="780" font-size="12" fill="#aaa">✓ 所有服务正常 | 最后更新: 2分钟前 | 版本: v1.0.0</text>
  <text x="1000" y="780" font-size="12" fill="#667eea">Spring Cloud + Istio Service Mesh</text>
</svg>