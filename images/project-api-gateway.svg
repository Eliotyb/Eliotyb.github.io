<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8787;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="300" fill="url(#grad2)"/>
  
  <!-- 左侧服务器 -->
  <rect x="60" y="100" width="60" height="50" rx="5" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="2"/>
  <rect x="65" y="110" width="50" height="8" rx="2" fill="white" opacity="0.6"/>
  <rect x="65" y="125" width="50" height="8" rx="2" fill="white" opacity="0.6"/>
  <rect x="65" y="140" width="50" height="8" rx="2" fill="white" opacity="0.6"/>
  
  <!-- 中间网关 -->
  <rect x="340" y="85" width="120" height="130" rx="10" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="3"/>
  <text x="400" y="145" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">API</text>
  <text x="400" y="165" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">网关</text>
  
  <!-- 箭头 -->
  <line x1="130" y1="125" x2="340" y2="150" stroke="white" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="150" x2="630" y2="125" stroke="white" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  
  <!-- 右侧服务 -->
  <g opacity="0.7">
    <rect x="680" y="100" width="60" height="50" rx="5" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="2"/>
    <rect x="685" y="110" width="50" height="8" rx="2" fill="white" opacity="0.6"/>
    <rect x="685" y="125" width="50" height="8" rx="2" fill="white" opacity="0.6"/>
    <rect x="685" y="140" width="50" height="8" rx="2" fill="white" opacity="0.6"/>
  </g>
  
  <!-- 负载均衡指示 -->
  <circle cx="300" cy="200" r="8" fill="white" opacity="0.8"/>
  <circle cx="400" cy="210" r="6" fill="white" opacity="0.6"/>
  <circle cx="500" cy="200" r="8" fill="white" opacity="0.8"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="white" />
    </marker>
  </defs>
  
  <!-- 标题 -->
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">API网关系统</text>
</svg>