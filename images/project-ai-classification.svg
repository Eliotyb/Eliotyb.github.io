<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#916AFF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="300" fill="url(#grad1)"/>
  
  <!-- 左侧数据可视化 -->
  <g opacity="0.3">
    <rect x="50" y="80" width="30" height="120" fill="white"/>
    <rect x="100" y="60" width="30" height="140" fill="white"/>
    <rect x="150" y="100" width="30" height="100" fill="white"/>
    <rect x="200" y="70" width="30" height="130" fill="white"/>
  </g>
  
  <!-- 中心大脑图标 -->
  <circle cx="400" cy="150" r="60" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
  <circle cx="400" cy="120" r="15" fill="white"/>
  <circle cx="370" cy="150" r="12" fill="white"/>
  <circle cx="430" cy="150" r="12" fill="white"/>
  <circle cx="400" cy="180" r="15" fill="white"/>
  
  <!-- 连接线 -->
  <line x1="400" y1="120" x2="370" y2="150" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="400" y1="120" x2="430" y2="150" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="400" y1="120" x2="400" y2="180" stroke="white" stroke-width="2" opacity="0.6"/>
  
  <!-- 右侧分类标签 -->
  <rect x="580" y="100" width="120" height="25" rx="5" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1.5"/>
  <text x="640" y="118" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">文本分类</text>
  
  <rect x="580" y="145" width="120" height="25" rx="5" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1.5"/>
  <text x="640" y="163" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">情感识别</text>
  
  <rect x="580" y="190" width="120" height="25" rx="5" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1.5"/>
  <text x="640" y="208" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">智能分析</text>
  
  <!-- 标题 -->
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">AI文本分类系统</text>
</svg>